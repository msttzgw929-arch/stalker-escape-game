<script>
'use strict';
const cvs=document.getElementById('c');
const ctx=cvs.getContext('2d');
let LW=960,LH=540,DPR=1,SC=1,OX=0,OY=0;
const FONT='"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",sans-serif';

// ---------- assets ----------
const IM={};let loaded=0,toLoad=0;
function loadImg(k,src){toLoad++;const i=new Image();i.onload=()=>{loaded++;};i.src=src;IM[k]=i;}
for(const k in ASSETS){if(k!=='meta')loadImg(k,ASSETS[k]);}
const META=ASSETS.meta;
const FACES=['normal','angry','rage','happy','pain'];
let womanCv=null,womanCx=null; // composed sprite with current face
function initWoman(){
  womanCv=document.createElement('canvas');womanCv.width=META.w;womanCv.height=META.h;
  womanCx=womanCv.getContext('2d');womanCx.drawImage(IM.sprite,0,0);
}
// face crossfade state
const face={from:'normal',to:'normal',t:1,dirty:true};
function setFace(f){ if(face.to===f)return; face.from=(face.t<0.5)?face.from:face.to; face.to=f; face.t=0; face.dirty=true; }
function updateFace(dt){
  if(face.t<1){face.t=Math.min(1,face.t+dt/0.22);face.dirty=true;}
  if(face.dirty&&womanCx){
    const x=META.faceX,y=META.faceY,w=META.faceW;
    womanCx.clearRect(x,y,w,w);
    womanCx.globalAlpha=1;womanCx.drawImage(IM['face_'+face.from],x,y,w,w);
    if(face.t>0){womanCx.globalAlpha=face.t;womanCx.drawImage(IM['face_'+face.to],x,y,w,w);}
    womanCx.globalAlpha=1;
    face.dirty=false;
  }
}

// ---------- audio ----------
let AC=null,master=null,muted=false,bgmGain=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=muted?0:0.6;master.connect(AC.destination);
  bgmGain=AC.createGain();bgmGain.gain.value=0.16;bgmGain.connect(master);
}
let noiseBuf=null;
function noise(){ if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;} const s=AC.createBufferSource();s.buffer=noiseBuf;return s;}
function env(g,t,a,peak,d){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);}
function tone(type,f0,f1,dur,vol,dest,when){
  if(!AC)return;const t=(when||AC.currentTime);const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  env(g,t,0.005,vol,dur);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+0.05);
}
const SFX={
  slap(){ if(!AC)return;const t=AC.currentTime;const n=noise();const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1800+Math.random()*900;bp.Q.value=0.8;
    const g=AC.createGain();env(g,t,0.002,0.9,0.11);n.connect(bp);bp.connect(g);g.connect(master);n.start(t);n.stop(t+0.2);
    tone('sine',190,55,0.18,0.7);},
  boing(big){ if(!AC)return;const t=AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();o.type='sine';
    const b=big?140:220;o.frequency.setValueAtTime(b,t);o.frequency.linearRampToValueAtTime(b*1.6,t+0.06);o.frequency.linearRampToValueAtTime(b*0.8,t+0.16);o.frequency.linearRampToValueAtTime(b*1.25,t+0.26);o.frequency.linearRampToValueAtTime(b*0.9,t+0.4);
    env(g,t,0.01,big?0.5:0.3,0.42);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.5);},
  step(lv){ tone('sine',75-lv*4,40,0.12,0.18+lv*0.04); },
  capture(){ tone('square',700,180,0.35,0.18); setTimeout(()=>tone('triangle',300,600,0.25,0.25),120); },
  levelup(){ if(!AC)return; tone('sawtooth',55,110,0.9,0.3); tone('square',220,440,0.5,0.12); setTimeout(()=>{tone('square',330,330,0.15,0.12);tone('square',415,415,0.15,0.1);},350); SFX.boing(true);},
  escape(){ if(!AC)return;const t=AC.currentTime;[523,659,784,1046].forEach((f,i)=>tone('triangle',f,0,0.14,0.25,master,t+i*0.07)); },
  hurt(){ tone('square',440,110,0.5,0.22); },
  over(){ if(!AC)return;const t=AC.currentTime;[392,330,262,196].forEach((f,i)=>tone('triangle',f,f*0.97,0.3,0.28,master,t+i*0.22)); },
  click(){ tone('triangle',880,1320,0.08,0.18); }
};
// simple tense BGM loop
let bgmNext=0,bgmStep=0,bgmOn=false;
const BASS=[45,45,57,45,48,45,52,50, 45,45,57,45,53,52,48,47];
function mtof(m){return 440*Math.pow(2,(m-69)/12);}
function bgmTick(){
  if(!AC||!bgmOn)return;
  const tempo=0.2-Math.min(0.07,G.level*0.012);
  while(bgmNext<AC.currentTime+0.15){
    const n=BASS[bgmStep%16];
    tone('triangle',mtof(n),0,tempo*0.9,0.5,bgmGain,bgmNext);
    if(bgmStep%4===2){const s=noise(),g=AC.createGain(),hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=6000;env(g,bgmNext,0.002,0.25,0.05);s.connect(hp);hp.connect(g);g.connect(bgmGain);s.start(bgmNext);s.stop(bgmNext+0.08);}
    if(bgmStep%16===0&&G.level>=2)tone('sawtooth',mtof(n+24),0,tempo*3,0.12,bgmGain,bgmNext);
    bgmNext+=tempo;bgmStep++;
  }
}
function startBgm(){ if(!AC)return; bgmOn=true; bgmNext=AC.currentTime+0.05; bgmStep=0; }
function stopBgm(){ bgmOn=false; }

// ---------- utils ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
function bump(v,a,p,b){ if(v<=a||v>=b)return 0; return v<p?sstep((v-a)/(p-a)):sstep((b-v)/(b-p)); }
function rnd(a,b){return a+Math.random()*(b-a);}

// ---------- springs ----------
function Spring(k,c){return {x:0,y:0,vx:0,vy:0,k,c};}
function stepSpring(s,dt,fx,fy,kmul){
  const k=s.k*(kmul||1);
  s.vx+=(-k*s.x-s.c*s.vx+(fx||0))*dt; s.vy+=(-k*s.y-s.c*s.vy+(fy||0))*dt;
  s.x+=s.vx*dt; s.y+=s.vy*dt;
  const L=46; if(s.x>L){s.x=L;s.vx*=-0.3;} if(s.x<-L){s.x=-L;s.vx*=-0.3;} if(s.y>L){s.y=L;s.vy*=-0.3;} if(s.y<-L){s.y=-L;s.vy*=-0.3;}
}

// ---------- extra 3D sounds ----------
function panTone(type,f0,f1,dur,vol,pan,when){
  if(!AC)return;const t=when||AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  env(g,t,0.004,Math.max(0.0002,vol),dur);o.connect(g);
  if(AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=clamp(pan,-1,1);g.connect(p);p.connect(master);}else g.connect(master);
  o.start(t);o.stop(t+dur+0.05);
}
SFX.stomp=function(vol,pan,lv){ if(!AC||vol<0.02)return; panTone('sine',85-lv*5,38,0.2,vol*0.9,pan); const t=AC.currentTime;const n=noise(),lp=AC.createBiquadFilter(),g=AC.createGain();lp.type='lowpass';lp.frequency.value=300;env(g,t,0.003,vol*0.5,0.12);n.connect(lp);lp.connect(g);
  if(AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=clamp(pan,-1,1);g.connect(p);p.connect(master);}else g.connect(master);n.start(t);n.stop(t+0.2);};
SFX.heart=function(vol){ if(!AC||vol<0.02)return; const t=AC.currentTime; tone('sine',62,40,0.12,vol,master,t); tone('sine',55,36,0.12,vol*0.7,master,t+0.16); };

function buildTextures(){

// ---------- woman ----------
const HSW=2.5;      // her height (world units)

function makeWoman(){
  return {x:0,y:0,vx:0,vy:0,phase:0,bob:0,sway:0,lean:0,
    U:Spring(130,6.5),L:Spring(85,4.2),B:Spring(170,7),SQ:Spring(110,5),
    G:0,Gv:0,Gt:0,stun:0,lastSin:0,r:0.6,bellyX:0,bellyY:0,bellyW:100,faceX:0,faceY:0,stepFlag:false};
}
function kickBelly(w,ix,iy,sq){ w.L.vx+=ix; w.L.vy+=iy; w.U.vx+=ix*0.7; w.U.vy+=iy*0.6; w.B.vx+=ix*0.4; w.B.vy+=iy*0.5; w.SQ.vx+=sq||0; }
function updateWoman(w,dt,latAcc,fwdAcc,speed){
  w.Gv+=((w.Gt-w.G)*34-w.Gv*5.5)*dt; w.G+=w.Gv*dt;
  const heavy=1/(1+w.G*0.12);
  const fx=-latAcc*9, fy=-fwdAcc*4;
  const moving=speed>0.08;
  if(moving) w.phase+=dt*(3.0+speed*1.6);
  const s=Math.sin(w.phase);
  w.stepFlag=false;
  if(moving&&Math.sign(s)!==Math.sign(w.lastSin)){ const side=s>0?1:-1; kickBelly(w,side*(10+w.G*2.5),(26+w.G*5)*Math.min(1,speed/1.6),0); w.stepFlag=true; }
  w.lastSin=s;
  w.bob=lerp(w.bob,moving?Math.abs(s):0,clamp(dt*14,0,1));
  w.sway=lerp(w.sway,moving?Math.sin(w.phase)*7:Math.sin(performance.now()/900)*2.5,clamp(dt*6,0,1));
  w.lean=lerp(w.lean,clamp(w.latVel||0,-1,1)*10,clamp(dt*4,0,1));
  stepSpring(w.U,dt,fx,fy,heavy); stepSpring(w.L,dt,fx*1.3,fy*1.3,heavy); stepSpring(w.B,dt,fx*0.8,fy*0.8,1); stepSpring(w.SQ,dt,0,0,heavy);
  w.L.vy+=Math.sin(performance.now()/420)*dt*14;
  const widthW=HSW*META.w/META.h;

}
// Draw her as a 3D billboard with per-row depth (belly bulges toward the camera).
// cam: {f, hor, h}  lat/d: camera-space lateral & forward distance (world units)
function drawWoman3D(c,w,lat,d,cam,opts){
  opts=opts||{};
  const img=womanCv,W=img.width,H=img.height,cxs=META.cx;
  const kW=HSW/H;                  // world units per sprite px
  const sqY=1-w.bob*0.035, sqX=1+w.bob*0.03;
  const ppr=cam.f/Math.max(0.3,d)*kW*(1+w.G*0.1);
  const STRIP=ppr>1.4?1:ppr>0.7?2:3;
  const N=Math.ceil(H/STRIP);
  const cums=new Float32Array(N+1);let cum=0;
  for(let i=0;i<=N;i++){cums[i]=cum;const v=(i*STRIP)/H;cum+=STRIP*(1+w.G*0.10*bump(v,.27,.68,1.0)+w.G*0.02*bump(v,.12,.24,.36));}
  const total=cums[N];
  const bulgeD=(opts.bulge==null?1:opts.bulge)*w.r*0.55/(1+w.G*0.12);
  const ys=new Float32Array(N+1),xs=new Float32Array(N+1),ws=new Float32Array(N+1),zs=new Float32Array(N+1),scs=new Float32Array(N+1);
  const LW2=LW/2;
  for(let i=0;i<=N;i++){
    const v=(i*STRIP)/H;
    const wb=bump(v,.12,.24,.37), wu=bump(v,.26,.42,.59), wl=bump(v,.44,.72,1.02);
    const dy=w.U.y*wu+w.L.y*wl+w.B.y*wb, dx=w.U.x*wu+w.L.x*wl+w.B.x*wb;
    const gw=1+w.G*0.13*bump(v,.24,.70,1.45)+w.G*0.04*wb;
    const sx=gw*(1+0.0065*(w.U.y*wu+w.L.y*wl)+0.004*w.B.y*wb+0.012*w.SQ.x*(wl+wu*0.6));
    const z=(total-cums[i]-dy)*kW*sqY;
    const bul=bulgeD*(bump(v,.30,.74,1.0)*0.9+wb*0.35)*(1+0.004*(w.L.y*wl));
    const dr=Math.max(0.18,d-bul);
    const sc=cam.f/dr;
    ys[i]=cam.hor-(z-cam.h)*sc; zs[i]=z; scs[i]=sc;
    if(i>0){const minY=ys[i-1]+0.4*(zs[i-1]-z)*scs[i-1]; if(ys[i]<minY)ys[i]=minY;}
    xs[i]=LW2+(lat+((w.sway+w.lean)*(1-v)*(1-v)+dx)*kW)*sc;
    ws[i]=sx*kW*sc*sqX;
  }
  const scF=cam.f/d, footY=cam.hor+cam.h*scF;
  // shadow + shoes
  if(opts.shadow!==false){
    const rx=w.r*1.15*scF, ry=rx*clamp(cam.h/d*1.2,0.04,0.6);
    c.fillStyle='rgba(0,0,0,0.35)';c.beginPath();c.ellipse(LW2+lat*scF,footY,rx,ry,0,0,Math.PI*2);c.fill();
  }
  const sh=0.09*scF, sp=META.w*0.14*kW*scF*(1+w.G*0.08);
  for(const side of[-1,1]){
    const lift=(w.bob>0.02)?Math.max(0,Math.sin(w.phase)*side)*0.07*scF:0;
    c.fillStyle='#2a0a0e';c.beginPath();c.ellipse(LW2+lat*scF+side*sp,footY-lift-sh*0.3,sh*1.9,sh*1.0,0,0,Math.PI*2);c.fill();
  }
  for(let i=0;i<N;i++){
    const sy=i*STRIP, sh2=Math.min(STRIP,H-sy);
    const y0=ys[i],y1=ys[i+1];
    const top=Math.min(y0,y1), hh=Math.abs(y1-y0)*(sh2/STRIP)+0.8;
    if(top>LH+50||top+hh<-50)continue;
    const sw=ws[i];
    c.drawImage(img,0,sy,W,sh2,xs[i]-cxs*sw,top,W*sw,hh);
  }
  const bi=Math.floor(N*0.70), fi=Math.floor(N*0.07);
  w.bellyX=xs[bi];w.bellyY=ys[bi];w.bellyW=META.w*0.5*ws[bi];w.faceX=xs[fi];w.faceY=ys[fi];w.topY=ys[0];
}

// ---------- collision ----------
function solidAt(x,y){return cell(x,y)!==0;}
function collides(x,y,r){
  for(let cy=Math.floor(y-r);cy<=Math.floor(y+r);cy++)for(let cx=Math.floor(x-r);cx<=Math.floor(x+r);cx++){
    if(cell(cx,cy)===0)continue;
    const nx=clamp(x,cx,cx+1),ny=clamp(y,cy,cy+1);if((x-nx)**2+(y-ny)**2<r*r)return true;}
  for(const l of LAMPS){if((x-l[0])**2+(y-l[1])**2<(r+0.12)**2)return true;}
  return false;
}

}
function update(dt){
  updateFace(dt);

    titleT+=dt;

    W0.Gt=(Math.sin(titleT*0.5)>0.6)?1.5:0;
    if(Math.random()<dt*0.8)kickBelly(W0,rnd(-30,30),rnd(20,50),rnd(-20,20));
    setFace((titleT%9<5)?'normal':(titleT%9<6.5?'happy':'angry'));
    updateWoman(W0,dt,0,0,0);
    G.close=0.15;
    return;
  }
  if(G.state==='over'){G.overT+=dt;updateWoman(W0,dt,0,0,0);if(Math.random()<dt*1.5)kickBelly(W0,rnd(-20,20),rnd(10,30),0);return;}
  if(G.state!=='play')return;
  const c=G.cap;
  if(c){
    c.t+=dt;
    if(c.phase==='mash'){c.time+=dt;c.gauge=Math.max(0,c.gauge-c.decay*dt);if(c.time>=c.limit)failCapture();}
    else if(c.phase==='hug'){c.end+=dt;if(Math.random()<dt*6)kickBelly(W0,rnd(-15,15),rnd(5,20),0);
      if(c.end>1.6){ if(G.lives<=0){gameOver();return;}
        const dx=W0.x-P.x,dy=W0.y-P.y,m=Math.hypot(dx,dy)||1;W0.vx=dx/m*3;W0.vy=dy/m*3;W0.stun=1.1;P.inv=2.5;G.cap=null;}}
    if(G.cap){
      // turn to face her
      const ri=relInfo(); P.a+=clamp(ri.ang,-dt*8,dt*8);

      heartbeat(dt,1);

    }
  }

  G.irr+=dt/(13+G.level*1.5);

  else{
    const maxS=Math.min(2.55,1.25+G.level*0.16+G.time*0.008);
    const tx=P.x+ca*P.spd*0.3, ty=P.y+sa*P.spd*0.3;
    let dx=tx-W0.x,dy=ty-W0.y;const m=Math.hypot(dx,dy)||1;dx/=m;dy/=m;
    // steering around obstacles
    let best=null;
    for(const off of[0,0.45,-0.45,0.9,-0.9,1.35,-1.35,1.8,-1.8]){
      const an=Math.atan2(dy,dx)+off, px=W0.x+Math.cos(an)*0.9, py=W0.y+Math.sin(an)*0.9;
      if(!collides(px,py,W0.r*0.8)){best=an;break;}
    }
    if(best==null)best=Math.atan2(dy,dx);
    const acc=3.2+G.level*0.3;
    ax=Math.cos(best)*acc;ay=Math.sin(best)*acc;
    W0.vx+=ax*dt;W0.vy+=ay*dt;
    const vm=Math.hypot(W0.vx,W0.vy);if(vm>maxS){W0.vx*=maxS/vm;W0.vy*=maxS/vm;}
    W0.vx*=Math.pow(0.5,dt);W0.vy*=Math.pow(0.5,dt);
  }
  const ox=W0.x,oy=W0.y;
  moveCircle(W0,W0.vx*dt,W0.vy*dt,W0.r*0.8);
  if(collides(W0.x,W0.y,W0.r*0.8)){/* grown into a wall: push out */ W0.x=ox;W0.y=oy;}
  const spd=Math.hypot(W0.x-ox,W0.y-oy)/dt;
  // accelerations in camera space for jiggle
  const latA=-ax*sa+ay*ca, fwdA=ax*ca+ay*sa;
  W0.latVel=-W0.vx*sa+W0.vy*ca;
  updateWoman(W0,dt,W0.stun>0?0:latA,W0.stun>0?0:fwdA,spd);
  const ri=relInfo();
  if(W0.stepFlag){const vol=clamp(1.6/(ri.dist+0.5),0,1)*(0.7+G.level*0.06);SFX.stomp(vol,Math.sin(ri.ang),G.level);
    if(ri.dist<4)G.shake=Math.max(G.shake,clamp((4-ri.dist)*1.6,0,6)*(1+W0.G*0.15));}
  G.close=lerp(G.close,clamp((6-ri.dist)/5,0,1),clamp(dt*3,0,1));
  heartbeat(dt,clamp((12-ri.dist)/11,0,1));
  G.warn=(Math.abs(ri.ang)>1.6&&ri.dist<7)?ri.ang:0;
  if(P.inv<=0&&ri.dist<W0.r+0.22){
    // pin camera-distance for capture
    startCapture();
  }
  chooseFace(dt);
}
function heartbeat(dt,closeness){
  G.hb-=dt; if(G.hb<=0&&closeness>0.02){G.hb=lerp(1.15,0.32,closeness);SFX.heart(0.08+closeness*0.55);G.hbPulse=1;} 
  G.hbPulse=Math.max(0,(G.hbPulse||0)-dt*3);
}
function chooseFace(dt){
  G.lvlFace=Math.max(0,G.lvlFace-dt);G.hitFace=Math.max(0,G.hitFace-dt);
  let f='normal';const c=G.cap;
  if(c)f=(c.phase==='mash'&&(G.hitFace>0||c.gauge>65))?'pain':'happy';
  else if(W0.stun>0)f='pain';
  else if(G.lvlFace>0)f='rage';
  else{const dist=Math.hypot(P.x-W0.x,P.y-W0.y);
    if(G.level===0)f=dist<2.6?'happy':'normal';
    else if(G.level===1)f=G.irr>0.5?'angry':(dist<2.6?'happy':'normal');
    else if(G.level<4)f='angry'; else f=G.irr>0.4?'rage':'angry';}
  setFace(f);
}
function levelUp(){
  W0.Gt=G.level;G.levelText=2.2;G.lvlFace=1.6;G.shake=14;
  SFX.levelup();kickBelly(W0,rnd(-30,30),-70,70);
  popup(LW/2,LH*0.22,'ムキーッ！！',36,'#ff3b3b',1.2,-30);
}
function gameOver(){
  G.state='over';G.overT=0;stopBgm();SFX.over();setFace('happy');
  if(G.time>G.best){G.best=G.time;G.newBest=true;try{localStorage.setItem('stalkerBest3d',String(G.best));}catch(e){}}else G.newBest=false;
}

// ---------- 3D render ----------
const COLW=2;
let colN=0,hitD=null,hitTop=null,hitCnt=null;
const MAXH=4;
function renderWorld(cam){
  const f=cam.f,hor=cam.hor,ch=cam.h;
  const ca=Math.cos(cam.a),sa=Math.sin(cam.a);
  // sky
  let g=ctx.createLinearGradient(0,hor-LH*1.2,0,hor);g.addColorStop(0,'#0b0618');g.addColorStop(0.7,'#2a1640');g.addColorStop(1,'#5a2a55');
  ctx.fillStyle=g;ctx.fillRect(0,-20,LW,hor+20);
  const fovH=Math.atan(LW/2/f);
  ctx.fillStyle='#fff';
  for(const s of TEX.stars){let da=s[0]-cam.a;da=Math.atan2(Math.sin(da),Math.cos(da));if(Math.abs(da)>fovH+0.05)continue;
    const x=LW/2+Math.tan(da)*f, y=hor-LH*0.35-s[1]*LH*0.9; ctx.globalAlpha=0.5+0.5*Math.sin(performance.now()/500+s[0]*30);ctx.fillRect(x,y,s[2],s[2]);}
  ctx.globalAlpha=1;
  {let da=-2.2-cam.a;da=Math.atan2(Math.sin(da),Math.cos(da));if(Math.abs(da)<fovH+0.2){const x=LW/2+Math.tan(da)*f,y=hor-LH*0.75;ctx.fillStyle='#fff6d8';ctx.shadowColor='#fff3c0';ctx.shadowBlur=40;ctx.beginPath();ctx.arc(x,y,26,0,7);ctx.fill();ctx.shadowBlur=0;}}
  // floor
  g=ctx.createLinearGradient(0,hor,0,LH);g.addColorStop(0,'#2b2030');g.addColorStop(0.25,'#5b4b5e');g.addColorStop(1,'#a2919c');
  ctx.fillStyle=g;ctx.fillRect(0,hor,LW,LH-hor+20);
  // floor grid lines (tiles)
  ctx.strokeStyle='rgba(30,15,35,0.28)';ctx.lineWidth=1;ctx.beginPath();
  const proj=(X,Y)=>{const dx=X-cam.x,dy=Y-cam.y;return [dx*ca+dy*sa,-dx*sa+dy*ca];};
  const seg=(x0,y0,x1,y1)=>{let a=proj(x0,y0),b=proj(x1,y1);const n=0.05;if(a[0]<n&&b[0]<n)return;
    if(a[0]<n){const t=(n-a[0])/(b[0]-a[0]);a=[n,a[1]+(b[1]-a[1])*t];} if(b[0]<n){const t=(n-b[0])/(a[0]-b[0]);b=[n,b[1]+(a[1]-b[1])*t];}
    ctx.moveTo(LW/2+a[1]*f/a[0],hor+ch*f/a[0]);ctx.lineTo(LW/2+b[1]*f/b[0],hor+ch*f/b[0]);};
  for(let k=1;k<MW;k+=0.5)seg(k,1,k,MH-1);
  for(let k=1;k<MH;k+=0.5)seg(1,k,MW-1,k);
  ctx.stroke();
  g=ctx.createLinearGradient(0,hor,0,hor+LH*0.12);g.addColorStop(0,'rgba(43,32,48,1)');g.addColorStop(1,'rgba(43,32,48,0)');ctx.fillStyle=g;ctx.fillRect(0,hor,LW,LH*0.12);
  // lamp glow pools on floor
  for(const l of LAMPS){const p=proj(l[0],l[1]);if(p[0]<0.3)continue;const x=LW/2+p[1]*f/p[0],y=hor+ch*f/p[0],r=1.6*f/p[0];if(x<-r*2||x>LW+r*2)continue;
    const rg=ctx.createRadialGradient(x,y,0,x,y,r*2);rg.addColorStop(0,'rgba(255,220,150,0.30)');rg.addColorStop(1,'rgba(255,220,150,0)');ctx.fillStyle=rg;ctx.beginPath();ctx.ellipse(x,y,r*2,r*2*Math.min(0.5,ch*3/p[0]+0.05),0,0,7);ctx.fill();}
  // raycast
  colN=Math.ceil(LW/COLW);
  if(!hitD||hitD.length<colN*MAXH){hitD=new Float32Array(colN*MAXH);hitTop=new Float32Array(colN*MAXH);hitCnt=new Uint8Array(colN);}
  const hitsT=[],hitsD=[],hitsX=[],hitsSide=[];
  for(let col=0;col<colN;col++){
    const sxp=col*COLW+COLW/2-LW/2;
    const rdx=ca-sa*(sxp/f), rdy=sa+ca*(sxp/f); // ray dir (not normalized: perp distance directly)
    let mx=Math.floor(cam.x),my=Math.floor(cam.y);
    const ddx=Math.abs(1/rdx),ddy=Math.abs(1/rdy);
    let stx,sty,sdx,sdy;
    if(rdx<0){stx=-1;sdx=(cam.x-mx)*ddx;}else{stx=1;sdx=(mx+1-cam.x)*ddx;}
    if(rdy<0){sty=-1;sdy=(cam.y-my)*ddy;}else{sty=1;sdy=(my+1-cam.y)*ddy;}
    let n=0;hitsT.length=0;hitsD.length=0;hitsX.length=0;hitsSide.length=0;
    let lastLow=-1;
    for(let it=0;it<64;it++){
      let side;
      if(sdx<sdy){sdx+=ddx;mx+=stx;side=0;}else{sdy+=ddy;my+=sty;side=1;}
      const t=cell(mx,my); if(!t)continue;
      const pd=side===0?(sdx-ddx):(sdy-ddy);
      let wx=side===0?cam.y+pd*rdy:cam.x+pd*rdx; wx-=Math.floor(wx);
      if(t===9){const id=my*MW+mx;if(id===lastLow)continue;lastLow=id;}
      hitsT.push(t);hitsD.push(Math.max(0.05,pd));hitsX.push(wx);hitsSide.push(side);
      if(t!==9||hitsT.length>=MAXH)break;
    }
    hitCnt[col]=0;
    for(let k=hitsT.length-1;k>=0;k--){
      const t=hitsT[k],d=hitsD[k],wh=wallH(t),tex=TEX[t];
      const yb=hor+ch*f/d, yt=hor-(wh-ch)*f/d;
      const tw=tex.width,th=tex.height;
      const texX=Math.floor(hitsX[k]*tw)%tw;
      if(t===9){ctx.drawImage(tex,texX,0,1,th,col*COLW,yt,COLW,yb-yt);}
      else{ // building: tile texture vertically (one tex = 7 units)
        const unitsPerTex=7, hp=yb-yt, rep=wh/unitsPerTex;
        // draw from bottom aligned
        const texPx=th*rep; // virtual height
        ctx.drawImage(tex,texX,0,1,th,col*COLW,yb-hp/rep,COLW,hp/rep+0.5);
        if(rep>1)ctx.drawImage(tex,texX,0,1,th*(rep-1),col*COLW,yt,COLW,hp-hp/rep+0.5);
      }
      const fog=clamp(d/20,0,0.8)+(hitsSide[k]?0.12:0);
      ctx.fillStyle=`rgba(25,12,35,${fog})`;ctx.fillRect(col*COLW,yt,COLW,yb-yt);
      const i=col*MAXH+hitCnt[col];hitD[i]=d;hitTop[i]=yt;hitCnt[col]++;
    }
  }
}
// clip to region not occluded by walls closer than d
function clipFor(d,x0,x1){
  ctx.beginPath();
  const c0=clamp(Math.floor(x0/COLW),0,colN-1),c1=clamp(Math.ceil(x1/COLW),0,colN-1);
  let runStart=c0,runTop=null;
  const lim=col=>{let t=LH*4;for(let k=0;k<hitCnt[col];k++){const i=col*MAXH+k;if(hitD[i]<d&&hitTop[i]<t)t=hitTop[i];}return Math.round(t);};
  for(let col=c0;col<=c1+1;col++){
    const t=col<=c1?lim(col):null;
    if(t!==runTop){ if(runTop!==null)ctx.rect(runStart*COLW,-LH*3,(col-runStart)*COLW,runTop+LH*3); runStart=col;runTop=t; }
  }
  ctx.clip();
}
function drawLamp(lat,d,cam){
  const sc=cam.f/d,x=LW/2+lat*sc,yb=cam.hor+cam.h*sc,H=3.4,yt=cam.hor-(H-cam.h)*sc,w=Math.max(1,0.07*sc);
  ctx.fillStyle='#231826';ctx.fillRect(x-w/2,yt,w,yb-yt);
  ctx.fillRect(x-w*1.6,yb-0.25*sc,w*3.2,0.25*sc);
  ctx.save();ctx.shadowColor='#ffd27a';ctx.shadowBlur=Math.min(60,0.6*sc);ctx.fillStyle='#ffeab0';ctx.beginPath();ctx.ellipse(x,yt,0.16*sc,0.2*sc,0,0,7);ctx.fill();ctx.restore();
}
function renderScene(cam,herOpts){
  renderWorld(cam);
  const ca=Math.cos(cam.a),sa=Math.sin(cam.a);
  const list=[];
  for(const l of LAMPS){const dx=l[0]-cam.x,dy=l[1]-cam.y,fw=dx*ca+dy*sa;if(fw<0.2||fw>30)continue;list.push({d:fw,lat:-dx*sa+dy*ca,type:'lamp'});}
  {const dx=W0.x-cam.x,dy=W0.y-cam.y,fw=dx*ca+dy*sa;if(fw>0.25||herOpts)list.push({d:herOpts?herOpts.d:fw,lat:herOpts?herOpts.lat:-dx*sa+dy*ca,type:'her'});}
  list.sort((a,b)=>b.d-a.d);
  for(const s of list){
    const sc=cam.f/s.d,x=LW/2+s.lat*sc;
    if(s.type==='lamp'){const w=0.3*sc;if(x<-w||x>LW+w)continue;ctx.save();clipFor(s.d,x-w,x+w);drawLamp(s.lat,s.d,cam);ctx.restore();}
    else{const w=W0.r*2.2*sc;if(x<-w||x>LW+w)continue;ctx.save();clipFor(s.d-W0.r*0.2,x-w,x+w);drawWoman3D(ctx,W0,s.lat,s.d,cam,herOpts);ctx.restore();}
  }
}
function computeCam(){
  const bob=Math.sin(P.walk*1)*P.bob;
  CAM.x=P.x;CAM.y=P.y;CAM.a=P.a;
  CAM.h=CAMH0+bob*0.012;
  CAM.hor=LH*0.60+G.close*LH*0.28+Math.pow(G.close,3)*LH*0.12+Math.abs(bob)*5;
}

// ---------- hands (first-person) ----------
function drawHand(x,y,s,rot,flip){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s*(flip?-1:1),s);
  // sleeve
  ctx.fillStyle='#3a7bd5';rr(ctx,-26,30,52,90,20);ctx.fill();ctx.fillStyle='#2c5fa8';rr(ctx,-28,24,56,16,8);ctx.fill();
  // palm
  ctx.fillStyle='#ffd9bf';ctx.strokeStyle='#c98f74';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.ellipse(0,0,26,30,0,0,7);ctx.fill();ctx.stroke();
  for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(-15+i*10,-30+Math.abs(i-1.5)*3,6,13,0,0,7);ctx.fill();ctx.stroke();}
  ctx.beginPath();ctx.ellipse(-27,2,7,13,-0.7,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,140,140,0.35)';ctx.beginPath();ctx.ellipse(0,4,14,10,0,0,7);ctx.fill();
  ctx.restore();
}
function drawHands(){
  const s=Math.min(LW,LH)/540*1.15;
  const t=performance.now()/1000;
  if(G.cap){
    const base=LH-60*s;
    for(const side of[-1,1]){
      let x=LW/2+side*LW*0.2, y=base+Math.sin(t*20+side)*4, sc=s, rot=side*0.25;
      if(G.cap.phase==='hug'){y=base+20*s+Math.sin(t*12)*6;}
      if(G.hand&&G.hand.side===side){const k=Math.sin(Math.min(1,G.hand.t/0.16)*Math.PI);x=lerp(x,G.hand.x,k);y=lerp(y,G.hand.y+40*s,k);sc=s*(1-0.35*k);rot=side*0.25*(1-k);}
      drawHand(x,y,sc,rot,side<0);
    }
  } else if(G.state==='play'){
    const bob=Math.sin(P.walk)*P.bob;
    for(const side of[-1,1]){
      const sw=bob*side*14*s;
      drawHand(LW/2+side*LW*0.36,LH+20*s+sw+(G.close>0.6?-10*s:0),s*0.9,side*0.45,side<0);
    }

}

// ---------- render ----------
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cvs.width,cvs.height);
  ctx.setTransform(SC*DPR,0,0,SC*DPR,OX*DPR,OY*DPR);
  ctx.save();ctx.beginPath();ctx.rect(0,0,LW,LH);ctx.clip();

  ctx.save();
  ctx.translate((Math.random()-0.5)*G.shake,(Math.random()-0.5)*G.shake);
  computeCam();
  let herOpts=null;
  if(G.cap||(G.state==='over')){
    // pinned against her belly, looking up at her face
    const t=G.cap?G.cap.t:1;
    const k=sstep(t/0.35);
    const d=lerp(1.25,0.95+W0.G*0.05,k);
    const cam={x:CAM.x,y:CAM.y,a:CAM.a,f:CAM.f*lerp(1,LW>LH?0.62:0.9,k),h:CAMH0,hor:0};
    // face target near top of screen

    if(G.capAdj==null)G.capAdj=0;
    if(k>0.5&&W0.faceY!=null){G.capAdj+=clamp((LH*0.13-W0.faceY)*0.15,-40,40);}
    cam.hor=lerp(LH*0.88,LH*0.12+(faceZ-cam.h)*cam.f/d+G.capAdj,k);
    herOpts={d,lat:0,bulge:0.42-W0.G*0.04,shadow:true};
    CAM.f2=cam.f;
    renderScene(cam,herOpts);
  } else {
    renderScene(CAM,null);
  }
  // ripples on belly
  for(const r of G.ripples){const k=r.t/0.45;ctx.strokeStyle=`rgba(255,255,255,${0.6*(1-k)})`;ctx.lineWidth=4*(1-k)+1;
    for(let j=0;j<2;j++){ctx.beginPath();ctx.ellipse(r.x,r.y,(20+k*140)*(1-j*0.4),(8+k*50)*(1-j*0.4),0,0,7);ctx.stroke();}}
  for(const p of G.parts){const a=1-p.t/p.life;ctx.globalAlpha=a;ctx.fillStyle=p.col;
    if(p.heart)drawHeart(ctx,p.x,p.y,p.r);else if(p.star)drawStar(ctx,p.x,p.y,p.r*1.6);else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}}
  ctx.globalAlpha=1;
  if(G.hand&&G.hand.t<0.1){const f=G.hand;ctx.strokeStyle='#fff';ctx.lineWidth=4;for(let i=0;i<10;i++){const an=i*Math.PI/5;ctx.beginPath();ctx.moveTo(f.x+Math.cos(an)*20,f.y+Math.sin(an)*20);ctx.lineTo(f.x+Math.cos(an)*(40+f.t*500),f.y+Math.sin(an)*(40+f.t*500));ctx.stroke();}}
  drawHands();
  ctx.restore();
  // danger vignette
  if(G.state==='play'){
    const dang=G.cap?0.5:G.close;
    if(dang>0.05){const pul=(G.hbPulse||0);const vg=ctx.createRadialGradient(LW/2,LH/2,Math.min(LW,LH)*0.35,LW/2,LH/2,Math.max(LW,LH)*0.75);
      vg.addColorStop(0,'rgba(255,0,60,0)');vg.addColorStop(1,`rgba(200,0,50,${dang*0.35+pul*0.2*dang})`);ctx.fillStyle=vg;ctx.fillRect(0,0,LW,LH);}
    if(G.warn&&!G.cap){const right=G.warn>0;const a=0.5+0.5*Math.sin(performance.now()/90);
      const gx=ctx.createLinearGradient(right?LW:0,0,right?LW-LW*0.25:LW*0.25,0);gx.addColorStop(0,`rgba(255,0,40,${0.55*a})`);gx.addColorStop(1,'rgba(255,0,40,0)');ctx.fillStyle=gx;ctx.fillRect(right?LW*0.75:0,0,LW*0.25,LH);
      const bg=ctx.createLinearGradient(0,LH,0,LH*0.75);bg.addColorStop(0,`rgba(255,0,40,${0.45*a})`);bg.addColorStop(1,'rgba(255,0,40,0)');ctx.fillStyle=bg;ctx.fillRect(0,LH*0.75,LW,LH*0.25);
      outlined('うしろにいる！',LW/2,LH*0.5,40,'#ff4060',a);
      outlined(right?'→ 右へふり向け':'左へふり向け ←',LW/2,LH*0.5+42,22,'#fff',a);}
  }
  if(G.flash>0){ctx.fillStyle=`rgba(255,60,120,${G.flash*0.5})`;ctx.fillRect(0,0,LW,LH);}
  for(const p of G.popups){const a=1-Math.max(0,(p.t-p.life*0.6)/(p.life*0.4));const s=p.size*(1+Math.max(0,0.25-p.t)*2);outlined(p.text,p.x,p.y,s,p.color,a);}
  if(G.state==='title')drawTitle();

  if(touch.active&&G.state==='play'&&!G.cap){ctx.globalAlpha=0.35;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(touch.ox,touch.oy,60,0,7);ctx.stroke();
    ctx.font=`bold 14px ${FONT}`;ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('前',touch.ox,touch.oy-74);ctx.fillText('後',touch.ox,touch.oy+74);ctx.fillText('↺',touch.ox-74,touch.oy);ctx.fillText('↻',touch.ox+74,touch.oy);
    ctx.beginPath();ctx.arc(touch.x,touch.y,24,0,7);ctx.fill();ctx.globalAlpha=1;}
  const mb=muteBtnRect();ctx.globalAlpha=0.6;ctx.fillStyle='#000';rr(ctx,mb.x,mb.y,mb.w,mb.h,8);ctx.fill();ctx.globalAlpha=1;ctx.font=`20px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(muted?'🔇':'🔊',mb.x+mb.w/2,mb.y+mb.h/2+1);
  ctx.restore();
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function drawHeart(c,x,y,r){c.beginPath();c.moveTo(x,y+r*0.8);c.bezierCurveTo(x-r*1.4,y-r*0.2,x-r*0.6,y-r*1.3,x,y-r*0.4);c.bezierCurveTo(x+r*0.6,y-r*1.3,x+r*1.4,y-r*0.2,x,y+r*0.8);c.fill();}
function drawStar(c,x,y,r){c.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr2=i%2?r*0.45:r;c.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);}c.closePath();c.fill();}
function outlined(text,x,y,size,col,alpha,align){
  ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.font=`900 ${size}px ${FONT}`;ctx.textAlign=align||'center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=Math.max(3,size*0.18);ctx.strokeStyle='rgba(30,0,20,0.9)';ctx.strokeText(text,x,y);ctx.fillStyle=col;ctx.fillText(text,x,y);ctx.restore();
}
function drawPortrait(x,y,r){
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle='#fbe3e8';ctx.fill();ctx.clip();
  const sz=r*2.35;ctx.drawImage(IM['port_'+face.from],x-sz/2,y-sz*0.47,sz,sz);
  if(face.t>0){ctx.globalAlpha=face.t;ctx.drawImage(IM['port_'+face.to],x-sz/2,y-sz*0.47,sz,sz);}
  ctx.restore();ctx.lineWidth=4;ctx.strokeStyle=G.level>=4?'#ff3b3b':'#ffb3c7';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();
}
function drawRadar(cx,cy,R){
  ctx.save();
  ctx.fillStyle='rgba(10,0,15,0.6)';ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.clip();
  const range=11,s=R/range;
  ctx.translate(cx,cy);ctx.rotate(-P.a-Math.PI/2);ctx.scale(s,s);ctx.translate(-P.x,-P.y);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const t=MAP[y*MW+x];if(!t)continue;if(Math.abs(x+0.5-P.x)>range+1||Math.abs(y+0.5-P.y)>range+1)continue;ctx.fillStyle=t===9?'rgba(120,200,130,0.55)':'rgba(200,170,220,0.45)';ctx.fillRect(x,y,1.02,1.02);}
  // her
  const pul=1+0.3*Math.sin(performance.now()/120);
  ctx.fillStyle='#ff2d55';ctx.beginPath();ctx.arc(W0.x,W0.y,(0.45+W0.r*0.4)*pul,0,7);ctx.fill();
  ctx.restore();
  // view cone + player
  ctx.save();ctx.translate(cx,cy);
  const fh=Math.atan(LW/2/CAM.f);
  ctx.fillStyle='rgba(255,255,255,0.12)';ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,-Math.PI/2-fh,-Math.PI/2+fh);ctx.closePath();ctx.fill();
  ctx.fillStyle='#7dffb0';ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(5,5);ctx.lineTo(-5,5);ctx.closePath();ctx.fill();
  ctx.restore();
  ctx.lineWidth=2.5;ctx.strokeStyle='rgba(255,180,200,0.8)';ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();
  const dist=Math.hypot(W0.x-P.x,W0.y-P.y);
  outlined('距離 '+dist.toFixed(1)+'m',cx,cy+R+14,15,dist<3?'#ff6b6b':'#fff');
}
function drawHUD(){
  const pad=12;
  ctx.fillStyle='rgba(0,0,0,0.45)';rr(ctx,pad,pad,200,62,12);ctx.fill();
  outlined('生存時間',pad+12,pad+16,15,'#ffd6e4',1,'left');
  outlined(G.time.toFixed(2)+' 秒',pad+12,pad+42,28,'#fff',1,'left');
  for(let i=0;i<3;i++){ctx.fillStyle=i<G.lives?'#ff4f8b':'rgba(255,255,255,0.25)';drawHeart(ctx,pad+20+i*26,pad+88,10);}
  const pr=LW>LH?40:36,px=LW-pad-pr-4,py=pad+pr+2;
  drawPortrait(px,py,pr);
  const bw=Math.min(240,LW*0.36),bx=px-pr-14-bw,by=pad+8;
  ctx.fillStyle='rgba(0,0,0,0.45)';rr(ctx,bx-8,by-4,bw+16,62,12);ctx.fill();
  outlined('イライラ度 Lv'+(G.level+1),bx,by+13,17,G.level>=4?'#ff6b6b':'#ffd6e4',1,'left');
  ctx.fillStyle='rgba(255,255,255,0.15)';rr(ctx,bx,by+30,bw,16,8);ctx.fill();
  const gr=ctx.createLinearGradient(bx,0,bx+bw,0);gr.addColorStop(0,'#ffb347');gr.addColorStop(1,'#ff2d55');ctx.fillStyle=gr;
  rr(ctx,bx,by+30,Math.max(16,bw*(G.level>=MAXLV?1:G.irr)),16,8);ctx.fill();
  if(G.level>=MAXLV)outlined('MAX',bx+bw/2,by+38,13,'#fff',1);
  if(!G.cap)drawRadar(pad+58,LH>LW?pad+180:pad+170,52);
  if(G.levelText>0){const a=Math.min(1,G.levelText),s=1+Math.max(0,G.levelText-1.8)*1.5;
    outlined('イライラ度 Lv'+(G.level+1)+'！',LW/2,LH*0.36,52*s,'#ff3b3b',a);outlined('お腹がさらに巨大化！',LW/2,LH*0.36+50,26,'#fff',a);}
  if(G.state==='play'&&!G.cap&&G.time<4){const m=('ontouchstart' in window)?'ドラッグ：上下で前進/後退・左右で旋回':'W/S・↑↓：前進/後退　A/D・←→：旋回';outlined(m,LW/2,LH-36,LW<600?17:21,'#fff',Math.min(1,4-G.time));}
}
function drawCaptureUI(){
  const c=G.cap;if(c.phase!=='mash')return;
  const bw=Math.min(400,LW*0.72),bx=LW/2-bw/2,by=LH-46;
  const pulse=1+Math.sin(performance.now()/70)*0.06;
  const tch=('ontouchstart' in window);
  ctx.fillStyle='rgba(0,0,0,0.5)';rr(ctx,bx-14,by-40,bw+28,84,14);ctx.fill();
  outlined(tch?'連打でお腹をはたけ！':'連打でお腹をはたけ！（スペース / クリック）',LW/2,by-20,(tch?26:22)*pulse,'#ffe066');
  ctx.fillStyle='rgba(255,255,255,0.15)';rr(ctx,bx,by,bw,22,11);ctx.fill();
  const gr=ctx.createLinearGradient(bx,0,bx+bw,0);gr.addColorStop(0,'#4fd1ff');gr.addColorStop(1,'#7dffb0');ctx.fillStyle=gr;rr(ctx,bx,by,Math.max(22,bw*c.gauge/100),22,11);ctx.fill();
  outlined('脱出ゲージ',bx+8,by+11,14,'#fff',1,'left');
  const tr=1-c.time/c.limit;ctx.fillStyle=tr<0.3?'#ff3b3b':'#ffb3c7';rr(ctx,bx,by+30,Math.max(6,bw*tr),8,4);ctx.fill();
}
function drawTitle(){
  const land=LW>LH;
  ctx.fillStyle='rgba(20,5,20,0.25)';ctx.fillRect(0,0,LW,LH);
  const tx=land?LW*0.28:LW/2,ty=land?LH*0.2:LH*0.07,wob=Math.sin(titleT*3)*3;
  outlined('巨腹ストーカー',tx,ty+wob,land?60:52,'#ff5c8a');
  outlined('から逃げろ！',tx,ty+(land?62:56)+wob,land?50:44,'#fff');
  outlined('〜小さな僕の一人称視点〜',tx,ty+(land?106:98),land?18:18,'#ffd6e4');
  const lines=['お腹が太ったストーカー女性に','捕まらないように逃げ回れ！','','前進/後退：W・S / ↑↓　旋回：A・D / ←→','スマホ：ドラッグ（上下で移動・左右で旋回）','捕まったら連打でお腹をはたいて脱出！','時間が経つとイライラしてお腹が巨大化…！'];
  const bw=land?400:470,bh=lines.length*26+20;
  ctx.fillStyle='rgba(0,0,0,0.55)';rr(ctx,tx-bw/2,ty+(land?126:118),bw,bh,14);ctx.fill();
  lines.forEach((l,i)=>outlined(l,tx,ty+(land?146:138)+i*26,land?15:17,i<2?'#ffd6e4':'#fff'));
  const a=0.6+Math.sin(titleT*4)*0.4;
  outlined(('ontouchstart' in window)?'タップでスタート':'クリック / スペースでスタート',tx,land?LH*0.88:LH*0.86,28,'#ffe066',a);
  if(G.best>0)outlined('ベスト: '+G.best.toFixed(2)+' 秒',tx,land?LH*0.94:LH*0.9,18,'#fff',1);
}
function drawOver(){
  const a=Math.min(1,G.overT*2);
  ctx.fillStyle=`rgba(30,0,20,${0.55*a})`;ctx.fillRect(0,0,LW,LH);
  outlined('つかまっちゃった…',LW/2,LH*0.3,54,'#ff5c8a',a);
  outlined('「もう逃がさないわよ♡」',LW/2,LH*0.3+56,24,'#ffd6e4',a);
  outlined('生存時間 '+G.time.toFixed(2)+' 秒',LW/2,LH*0.54,40,'#fff',a);
  outlined((G.newBest?'★ベスト更新！ ':'ベスト ')+G.best.toFixed(2)+' 秒',LW/2,LH*0.54+46,22,G.newBest?'#ffe066':'#ffd6e4',a);
  outlined('最終イライラ度 Lv'+(G.level+1),LW/2,LH*0.54+80,18,'#ffb3c7',a);
  if(G.overT>0.9)outlined(('ontouchstart' in window)?'タップでリトライ':'スペース / クリックでリトライ',LW/2,LH*0.86,30,'#ffe066',0.6+Math.sin(G.overT*4)*0.4);
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;
  if(G.state==='loading'&&loaded===toLoad&&toLoad>0){initWoman();buildTextures();G.state='title';resetGame();}
  if(G.state!=='loading'){const sub=dt>0.02?2:1;for(let i=0;i<sub;i++)update(dt/sub);}
  bgmTick();render();
  requestAnimationFrame(frame);
}
resize();requestAnimationFrame(frame);
window.__G=G;window.__W=W0;window.__P=P;window.__startGame=startGame;
window.__levelUp=()=>{if(G.level<MAXLV){G.level++;G.irr=0;levelUp();}};
window.__place=(d,lat)=>{const ca=Math.cos(P.a),sa=Math.sin(P.a);W0.x=P.x+ca*d-sa*lat;W0.y=P.y+sa*d+ca*lat;W0.vx=W0.vy=0;};
</script>
